<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment received — BWP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111;font-family:'DM Sans',sans-serif;padding:24px}
    main{width:min(920px,100%);border:1px solid #deded9;padding:clamp(30px,7vw,88px);position:relative;overflow:hidden}
    main:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ff4b19;right:-110px;top:-120px}
    .brand{font-family:'Archivo Black',sans-serif;font-size:1.25rem;letter-spacing:-.05em;display:flex;align-items:center;gap:9px}.brand:before{content:"";width:11px;height:11px;background:#ff4b19}
    .label{font:500 .7rem/1.4 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;color:#696969;margin-top:clamp(56px,9vw,110px)}
    h1{font:400 clamp(3rem,8vw,7.2rem)/.88 'Archivo Black',sans-serif;letter-spacing:-.07em;text-transform:uppercase;margin:20px 0 26px;max-width:9ch}
    p{font-size:clamp(1rem,2vw,1.25rem);line-height:1.55;color:#606060;max-width:54ch;margin:0}
    .next{margin-top:34px;padding-top:24px;border-top:1px solid #deded9;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;background:#111;color:#fff;padding:13px 20px;text-decoration:none;font-weight:700;font-size:.86rem}a:hover{background:#ff4b19}
  </style>
</head>
<body>
  <main>
    <div class="brand">BWP</div>
    <div class="label">Payment confirmed</div>
    <h1>You're in.</h1>
    <p>Thank you for choosing BWP. Your project is officially in our queue. Our lead designer will contact you soon to confirm your goals, content, and next steps.</p>
    <div class="next">
      <span class="label" style="margin:0">Watch your inbox and phone</span>
      <a href="/">Back to BWP →</a>
    </div>
  </main>
</body>
</html>
